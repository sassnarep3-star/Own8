name: Verify independent NFL desk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  independent-desk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/audit.py
      - run: python3 scripts/analyze.py
      - run: python3 scripts/verify_snapshot.py
      - run: python3 scripts/build_site.py
      - run: python3 scripts/check_links.py
