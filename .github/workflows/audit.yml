name: Inherited audit evidence checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/analyze.py
      - run: python3 scripts/audit_repo.py
      - run: python3 -m unittest discover -s scripts -p test_audit.py -v
