name: Verify official-evidence dashboard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  evidence-and-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/strict_build_site.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/strict_check.py
      - name: Confirm deterministic generated outputs
        run: git diff --exit-code -- strict/site strict/results.json strict/link-check.json
